plugins {
    id 'com.android.application'
}

// DeepSeek API Key 从 local.properties 读取（该文件不入库）
// 配置方法：在 local.properties 中添加一行  DEEPSEEK_API_KEY=sk-xxxxxxxx
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def deepseekKey = localProps.getProperty('DEEPSEEK_API_KEY', '')

android {
    namespace 'com.example.meituan'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.meituan"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "DEEPSEEK_API_KEY", "\"${deepseekKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
